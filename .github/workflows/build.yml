name: Build

on:
  workflow_dispatch:
  push:
    branches:
      - master

permissions:
  contents: write

defaults:
  run:
    shell: bash

concurrency:
  group: build
  cancel-in-progress: false

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup NodeJs
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Install 7z
        run: |
          sudo apt-get update
          sudo apt-get install -y p7zip-full

      - name: Smoke tests
        run: |
          node --test launcher/test/smoke.test.js

  sanity:
    runs-on: ubuntu-latest
    needs: smoke
    steps:
      - uses: actions/checkout@v7

      - name: Setup NodeJs
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Sanity tests
        run: |
          node --test launcher/test/path_utils.test.js
          bash autotest.sh 2>&1 | tee "${RUNNER_TEMP}/autotest.log" || true
          if grep -q "client digest mismatch" "${RUNNER_TEMP}/autotest.log"; then
            echo "LuaMenu client digest mismatch" >&2
            exit 1
          fi

  regression:
    runs-on: ubuntu-latest
    needs: sanity
    steps:
      - uses: actions/checkout@v7

      - name: Setup NodeJs
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: 'npm'
          cache-dependency-path: launcher/package-lock.json

      - name: Install 7z
        run: |
          sudo apt-get update
          sudo apt-get install -y p7zip-full

      - name: Install dependencies
        run: |
          cd launcher
          npm ci

      - name: Regression tests
        run: |
          cd launcher
          node --test test/regression.test.js

  launcher:
    runs-on: ${{ matrix.os }}
    needs: regression
    permissions:
      contents: write
      id-token: write
    env:
      ELECTRON_CACHE: ${{ github.workspace }}/.electron-cache/main
      ELECTRON_BUILDER_CACHE: ${{ github.workspace }}/.electron-cache/builder
    strategy:
      matrix:
        include:
          - os: ubuntu-22.04
            build_cmd: "build-linux"
            arch: "--x64"

          - os: windows-latest
            build_cmd: "build-win"
            arch: "--x64"

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup NodeJs
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: 'npm'
          cache-dependency-path: launcher/package-lock.json

      - name: Patch launcher with dist_cfg
        run: |
          cp -r dist_cfg/* launcher/src/
          for dir in bin files build; do
            mkdir -p launcher/$dir
            if [ -d launcher/src/$dir/ ]; then
              mv launcher/src/$dir/* launcher/$dir/
              rm -rf launcher/src/$dir
            fi
          done
          exit 0

      - name: Make package.json
        run: |
          export PACKAGE_VERSION=1.$(git rev-list --count HEAD).0
          echo "Making build for version: $PACKAGE_VERSION"
          node build/make_package_json.js launcher/package.json dist_cfg/config.json $GITHUB_REPOSITORY $PACKAGE_VERSION

      - name: Cache electron
        uses: actions/cache@v6
        with:
          path: .electron-cache
          key: ${{ runner.os }}-electron-cache-${{ hashFiles('launcher/package.json') }}
          restore-keys: |
            ${{ runner.os }}-electron-cache-

      - name: Build
        run: |
          cd launcher
          npm ci
          npm run ${{ matrix.build_cmd }} -- ${{ matrix.arch }} --publish never

      - name: Upload launcher
        uses: actions/upload-artifact@v7
        with:
          name: launcher-${{ matrix.build_cmd }}
          path: launcher/dist
          if-no-files-found: error

  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    needs: [launcher, menu]
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Compute version and tag
        run: |
          FULL_COUNT=$(git rev-list --count HEAD)
          SHA7=${GITHUB_SHA:0:7}
          echo "VERSION=1.$FULL_COUNT.0-$SHA7" >> "$GITHUB_ENV"
          echo "TAG=v1.$FULL_COUNT.0-$SHA7" >> "$GITHUB_ENV"

      - name: Download launcher artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: launcher-*
          path: launcher-dist
          merge-multiple: true

      - name: Download menu archive
        uses: actions/download-artifact@v8
        with:
          name: menu-archive
          path: launcher-dist

      - name: Generate update manifests
        run: |
          python3 - <<'PYEOF'
          import base64
          import hashlib
          import os
          from datetime import datetime, timezone

          root = "launcher-dist"
          version = os.environ["VERSION"]

          def sha512_b64(path):
              h = hashlib.sha512()
              with open(path, "rb") as f:
                  for chunk in iter(lambda: f.read(1 << 20), b""):
                      h.update(chunk)
              return base64.b64encode(h.digest()).decode()

          def asset_name(path):
              return os.path.basename(path).replace(" ", ".")

          def write_manifest(channel, main_path):
              entries = [{"url": asset_name(main_path), "sha512": sha512_b64(main_path), "size": os.path.getsize(main_path)}]
              block_path = main_path + ".blockmap"
              if os.path.exists(block_path):
                  entries.append({"url": asset_name(block_path), "sha512": sha512_b64(block_path), "size": os.path.getsize(block_path)})
              body = "version: " + version + "\n"
              body += "files:\n"
              for e in entries:
                  body += "  - url: " + e["url"] + "\n"
                  body += "    sha512: '" + e["sha512"] + "'\n"
                  body += "    size: " + str(e["size"]) + "\n"
              body += "path: " + asset_name(main_path) + "\n"
              body += "sha512: '" + entries[0]["sha512"] + "'\n"
              body += "releaseDate: '" + datetime.now(timezone.utc).strftime("%Y-%m-%dT%H:%M:%S.000Z") + "'\n"
              with open(os.path.join(root, channel), "w") as f:
                  f.write(body)

          for f in os.listdir(root):
              full = os.path.join(root, f)
              if not os.path.isfile(full):
                  continue
              if f.endswith(".exe"):
                  write_manifest("latest.yml", full)
              elif f.endswith(".AppImage"):
                  write_manifest("latest-linux.yml", full)
          PYEOF

      - name: Publish release
        id: publish1
        continue-on-error: true
        run: |
          set -euo pipefail
          if ! gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create "$TAG" --repo "$GITHUB_REPOSITORY"
          fi
          while IFS= read -r f; do
            timeout 600 gh release upload "$TAG" "$f" --repo "$GITHUB_REPOSITORY" --clobber
          done < <(find launcher-dist -type f ! -path '*unpacked*')

      - name: Publish release (retry 1)
        id: publish2
        if: steps.publish1.outcome == 'failure'
        continue-on-error: true
        run: |
          set -euo pipefail
          if ! gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create "$TAG" --repo "$GITHUB_REPOSITORY"
          fi
          while IFS= read -r f; do
            timeout 600 gh release upload "$TAG" "$f" --repo "$GITHUB_REPOSITORY" --clobber
          done < <(find launcher-dist -type f ! -path '*unpacked*')

      - name: Publish release (retry 2)
        if: steps.publish2.outcome == 'failure'
        run: |
          set -euo pipefail
          if ! gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create "$TAG" --repo "$GITHUB_REPOSITORY"
          fi
          while IFS= read -r f; do
            timeout 600 gh release upload "$TAG" "$f" --repo "$GITHUB_REPOSITORY" --clobber
          done < <(find launcher-dist -type f ! -path '*unpacked*')

      - name: Verify release assets
        id: verify
        run: |
          set -euo pipefail
          mapfile -t EXPECTED < <(find launcher-dist -type f ! -path '*unpacked*' -printf '%f\n' | sort -u)
          mapfile -t PRESENT < <(gh api "repos/$GITHUB_REPOSITORY/releases/tags/$TAG" --jq '.assets[].name')
          missing=()
          for f in "${EXPECTED[@]}"; do
            folded="${f// /.}"
            if ! printf '%s\n' "${PRESENT[@]}" | grep -qx "$f" && ! printf '%s\n' "${PRESENT[@]}" | grep -qx "$folded"; then
              missing+=("$f")
            fi
          done
          if [ "${#missing[@]}" -gt 0 ]; then
            echo "Release $TAG is missing ${#missing[@]} asset(s):"
            printf '  - %s\n' "${missing[@]}"
            exit 1
          fi
          echo "All ${#EXPECTED[@]} release assets verified on $TAG"

      - name: Prune old releases and tags
        if: steps.verify.outcome == 'success'
        run: |
          set -euo pipefail
          mapfile -t ALL < <(gh api "repos/$GITHUB_REPOSITORY/releases?per_page=100" --paginate --jq 'sort_by(.published_at) | reverse | .[] | .tag_name')
          TOTAL=${#ALL[@]}
          if [ "$TOTAL" -le 1 ]; then
            echo "Only $TOTAL release(s), nothing to prune"
            exit 0
          fi
          echo "Pruning oldest $((TOTAL - 1)) of $TOTAL release(s)"
          for ((i=1; i<TOTAL; i++)); do
            t="${ALL[$i]}"
            echo "Pruning release + tag: $t"
            gh release delete "$t" --repo "$GITHUB_REPOSITORY" --yes --cleanup-tag
          done

      - name: Repoint launcher config at the new menu
        env:
          MENU_COUNT: ${{ needs.menu.outputs.menu_count }}
          MENU_URL: ${{ needs.menu.outputs.menu_url }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for attempt in 1 2 3; do
            git fetch origin
            git checkout -B master origin/master
            node build/update_launcher_config.js dist_cfg/config.json "$MENU_URL" "$MENU_COUNT"
            git add dist_cfg/config.json
            if git diff --cached --quiet; then
              echo "config unchanged"
              exit 0
            fi
            git commit -m "Update menu target to build $MENU_COUNT"
            if git push origin master; then
              echo "menu target updated"
              exit 0
            fi
          done
          exit 1

  menu:
    runs-on: ubuntu-latest
    needs: regression
    outputs:
      menu_count: ${{ steps.numbers.outputs.menu_count }}
      menu_url: ${{ steps.numbers.outputs.menu_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Compute build numbers
        id: numbers
        run: |
          FULL_COUNT=$(git rev-list --count HEAD)
          MENU_COUNT=$(git rev-list --count HEAD -- ':(exclude)dist_cfg/config.json')
          SHA7=${GITHUB_SHA:0:7}
          echo "MENU_COUNT=$MENU_COUNT" >> "$GITHUB_ENV"
          echo "TAG=v1.$FULL_COUNT.0-$SHA7" >> "$GITHUB_ENV"
          echo "ASSET=BYAR-Chobby-$MENU_COUNT.sdd.7z" >> "$GITHUB_ENV"
          MENU_URL="https://github.com/$GITHUB_REPOSITORY/releases/download/v1.$FULL_COUNT.0-$SHA7/BYAR-Chobby-$MENU_COUNT.sdd.7z"
          echo "MENU_URL=$MENU_URL" >> "$GITHUB_ENV"
          echo "menu_count=$MENU_COUNT" >> "$GITHUB_OUTPUT"
          echo "menu_url=$MENU_URL" >> "$GITHUB_OUTPUT"
          echo "Menu build: $MENU_COUNT  Release tag: v1.$FULL_COUNT.0-$SHA7"

      - name: Install archiver
        run: |
          sudo apt-get update
          sudo apt-get install -y p7zip-full

      - name: Stage and pack the menu
        run: |
          set -euo pipefail
          STAGE="$RUNNER_TEMP/BYAR-Chobby-$MENU_COUNT.sdd"
          mkdir -p "$STAGE" "$GITHUB_WORKSPACE/artifacts"
          cp -a . "$STAGE/"
          rm -rf "$STAGE/.git" "$STAGE/.github"
          sed -i "s/version = '\$VERSION'/version = '$MENU_COUNT'/" "$STAGE/modinfo.lua"
          cd "$STAGE"
          7z a -bd -mx=9 "$GITHUB_WORKSPACE/artifacts/$ASSET" . >/dev/null
          cd "$GITHUB_WORKSPACE"

      - name: Upload menu archive
        uses: actions/upload-artifact@v7
        with:
          name: menu-archive
          path: artifacts
          if-no-files-found: error
